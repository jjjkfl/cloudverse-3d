      .atom { font-family: 'Inter', sans-serif; font-size: 70px; fill: url(#goldGradient); }
      .text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 80px; fill: url(#goldGradient); letter-spacing: -2px; }

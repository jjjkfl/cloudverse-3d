<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0ede6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01b8fd;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .atom { font-family: 'Inter', sans-serif; font-size: 70px; fill: #01b8fd; filter: drop-shadow(0 0 8px rgba(1, 184, 253, 0.6)); }
      .text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 80px; fill: url(#textGradient); letter-spacing: -2px; }
    </style>
  </defs>
  <text x="20" y="95" class="atom">⚛</text>
  <text x="110" y="95" class="text">Cloudverse</text>
</svg>

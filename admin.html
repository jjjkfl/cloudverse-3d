<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudverse Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080810;
            --bg-secondary: #13141f;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-primary: #01b8fd;
            --accent-secondary: #9d4edd;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 20px 40px;
            background: rgba(8, 8, 16, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            flex-grow: 1;
        }

        /* Login Section */
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
        }

        .login-box {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Dashboard Section */
        .dashboard-section {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            font-size: 2rem;
            font-weight: 600;
        }

        .stats-banner {
            background: var(--bg-secondary);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: inline-block;
            margin-bottom: 20px;
        }

        .stats-banner span {
            color: var(--accent-primary);
            font-weight: 700;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .email-link {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        .msg-cell {
            max-width: 300px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .error-message {
            color: #ff4757;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent-primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">⚛ Cloudverse Admin</div>
    </div>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div class="login-section" id="loginSection">
            <div class="login-box">
                <h2>Admin Identity</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="password" id="adminKey" placeholder="Enter Secret Key" required>
                    </div>
                    <button type="submit" class="btn" id="loginBtn">Access Records</button>
                    <div class="loader" id="loginLoader"></div>
                    <p class="error-message" id="errorMessage">Invalid key.</p>
                </form>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div class="dashboard-section" id="dashboardSection">
            <div class="dashboard-header">
                <h2>Contact Submissions</h2>
                <button class="btn" style="width: auto;" onclick="logout()">Lock Portal</button>
            </div>
            
            <div class="stats-banner">
                Total Submissions: <span id="totalCount">0</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Service</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Populated via Javascript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const adminKeyInput = document.getElementById('adminKey');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginLoader = document.getElementById('loginLoader');
        
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const tableBody = document.getElementById('tableBody');
        const totalCount = document.getElementById('totalCount');

        let sessionKey = null;

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = adminKeyInput.value.trim();
            if(!key) return;

            // UI State loading
            loginBtn.style.display = 'none';
            loginLoader.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                const response = await fetch('/api/admin/contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });

                const data = await response.json();

                if(response.ok && data.success) {
                    // Success setup
                    sessionKey = key;
                    renderTable(data.contacts);
                    
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                } else {
                    // Fail
                    errorMessage.textContent = data.message || 'Access Denied.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Server connection failed.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.style.display = 'block';
                loginLoader.style.display = 'none';
            }
        });

        function renderTable(contacts) {
            totalCount.textContent = contacts.length;
            tableBody.innerHTML = '';

            if (contacts.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">No messages received yet.</td></tr>';
                return;
            }

            contacts.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="timestamp">${new Date(c.timestamp).toLocaleString()}</td>
                    <td><b>${c.name || 'N/A'}</b><br><small style="color:var(--text-secondary)">#${c.id}</small></td>
                    <td><a class="email-link" href="mailto:${c.email}">${c.email}</a><br><small style="color:var(--text-secondary)">${c.phone || 'No phone'}</small></td>
                    <td>${c.company || 'N/A'}</td>
                    <td>${c.service || 'N/A'}</td>
                    <td class="msg-cell">${c.message}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function logout() {
            sessionKey = null;
            adminKeyInput.value = '';
            dashboardSection.style.display = 'none';
            loginSection.style.display = 'flex';
        }
    </script>
</body>
</html>

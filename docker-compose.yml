version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: cloudverse_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_super_secret_password
      MYSQL_DATABASE: cloudverse
      MYSQL_USER: cloudverse_user
      MYSQL_PASSWORD: cloudverse_pass
    ports:
      - "3308:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
